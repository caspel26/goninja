name: docs

on:
  # Deploys only on a tagged release or by hand - not on every merge to main -
  # so doc changes land on goninja.dev in step with a release, not the moment
  # they're merged.
  release:
    types: [published]
  workflow_dispatch:

# Denied by default and granted per job below, so the build job never holds the
# deploy job's write scopes.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          # Released versions are built from their tags, so the full history
          # and all tags have to be present.
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: docs-site/go.mod
      - uses: peaceiris/actions-hugo@6e295a6a0c9087bf374299e9d67f9d2edab9f18f # v3.0.0
        with:
          hugo-version: "0.165.0"
          extended: true
      # No configure-pages step: its only output is the Pages-provided base URL,
      # which this site does not use because baseURL comes from the custom
      # domain. Dropping it also keeps `pages` scopes out of this job.
      - name: Build all documented versions
        # Builds the working tree at the root and a frozen snapshot per release
        # tag at /vX.Y/ — one tree, one artifact. baseURL comes from the custom
        # domain, not from the Pages-provided URL.
        env:
          BASE_URL: https://goninja.dev
          # Authenticates the navbar star-count request; unauthenticated GitHub
          # API calls are rate-limited per IP and runners share addresses.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-docs.sh "${{ github.workspace }}/public"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
