name: bench

on:
  pull_request:
    branches: ["main"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "scripts/bench-regression.sh"
      - "scripts/testdata/bench-baseline.txt"
      - ".github/workflows/bench.yml"
      - "Makefile"
  workflow_dispatch:

# Denied by default and granted per job, so a job never inherits more than it
# needs from the repository's default token permissions.
permissions: {}

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      # examples/prototype/benchmark_test.go seeds rows and drives real HTTP
      # requests, all in-process (in-memory SQLite via goninjatest) - no
      # external services needed.
      - name: Benchmark regression check
        run: make bench-check
