# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Denied by default and granted per job, so a job never inherits more than it
# needs from the repository's default token permissions.
permissions: {}

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Format check
      run: |
        fmt_out="$(gofmt -l .)"
        if [ -n "$fmt_out" ]; then
          echo "The following files are not gofmt'd:"
          echo "$fmt_out"
          exit 1
        fi

    - name: Test
      run: go test -v ./...

    - name: Coverage threshold
      run: ./scripts/coverage.sh 70

  # adapters/{gin,echo,chi} are each their own Go module (see CLAUDE.md —
  # kept out of the root module so gin/echo/chi are never a dependency cost
  # for a plain net/http user), so they sit outside the build job's
  # `go test ./...` entirely and need their own step.
  adapters:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        adapter: [gin, echo, chi]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...
      working-directory: adapters/${{ matrix.adapter }}

    - name: Vet
      run: go vet ./...
      working-directory: adapters/${{ matrix.adapter }}

    - name: Test
      run: go test -v ./...
      working-directory: adapters/${{ matrix.adapter }}
