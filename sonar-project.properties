# SonarQube Cloud project configuration.
# Project key/organization must match the SonarCloud project this repo is
# bound to (see CLAUDE.md/HANDOFF.md for the MCP-server setup story).
sonar.projectKey=caspel26_goninja
sonar.organization=caspel26

sonar.sources=.
sonar.exclusions=**/*_generated.go,docsui/swagger-ui/**,docsui/redoc/**,docs/**

sonar.go.coverage.reportPaths=coverage.out
# go test's own coverage instrumentation never records coverage of test
# files themselves (a test isn't "covered" by another test), so
# coverage.out never has data for any _test.go line. Without this,
# SonarCloud counts every new/changed test-file line as 0% covered, which
# tanked the new-code coverage gate. Test files are still analyzed for
# issues/code smells — this only exempts them from the coverage metric.
# examples/prototype and cmd/goninja are deliberately excluded from
# go test itself (scripts/coverage.sh) — prototype is exercised manually
# against real Postgres, and cmd/goninja is a thin flag-parsing wrapper —
# so they also have no coverage.out data and shouldn't count against the
# coverage gate.
sonar.coverage.exclusions=**/*_test.go,examples/prototype/**,cmd/goninja/**
