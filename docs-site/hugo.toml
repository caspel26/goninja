baseURL = 'https://caspel26.github.io/goninja/'
locale = 'en-us'
title = 'goninja'

theme = 'github.com/imfing/hextra'

[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  description = "Generate typed, validated REST APIs from annotated Go structs — no reflection, no runtime magic."

  [params.theme]
    default = 'system'

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.footer]
    displayCopyright = true
    displayPoweredBy = true

[[menu.main]]
  identifier = 'docs'
  name = 'Docs'
  pageRef = '/docs'
  weight = 1

[[menu.main]]
  name = 'GitHub'
  url = 'https://github.com/caspel26/goninja'
  weight = 2
  [menu.main.params]
    icon = 'github'
