baseURL = 'https://goninja.dev/'
locale = 'en-us'
title = 'goninja'

theme = 'github.com/imfing/hextra'

enableGitInfo = true

[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[markup]
  [markup.highlight]
    noClasses = false
    lineNumbersInTable = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  description = "Generate typed, validated REST APIs from annotated Go structs — no reflection, no runtime magic."

  [params.search]
    enable = true
    type = 'flexsearch'
    [params.search.flexsearch]
      index = 'content'

  [params.theme]
    default = 'system'
    displayToggle = true

  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = 'wide'

    [params.navbar.logo]
      path = 'images/logo.png'
      width = 26
      height = 26

  [params.page]
    width = 'normal'

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false
    width = 'normal'

  [params.editURL]
    enable = true
    base = 'https://github.com/caspel26/goninja/edit/main/docs-site/content'

  [params.toc]
    displayTags = true

  [params.blog]
    [params.blog.list]
      displayTags = true

[[menu.main]]
  identifier = 'docs'
  name = 'Docs'
  pageRef = '/docs'
  weight = 1

[[menu.main]]
  identifier = 'examples'
  name = 'Examples'
  pageRef = '/docs/examples'
  weight = 2

[[menu.main]]
  name = 'Search'
  weight = 3
  [menu.main.params]
    type = 'search'

[[menu.main]]
  name = 'GitHub'
  weight = 4
  url = 'https://github.com/caspel26/goninja'
  [menu.main.params]
    icon = 'github'
